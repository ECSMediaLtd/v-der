<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Väder i Säve – SMHI</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#12365b;background:#f2f8fc}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{display:grid;place-items:center;background:linear-gradient(140deg,#fff,#eaf5fb)}
.widget{width:100%;height:100%;padding:clamp(14px,3vw,34px);display:flex;flex-direction:column;justify-content:center;gap:clamp(8px,2vh,20px)}
.top{display:flex;align-items:center;gap:clamp(10px,2vw,24px)}
.mark{width:7px;align-self:stretch;min-height:42px;border-radius:8px;background:#2ba6a4}
h1{font-size:clamp(18px,3vw,38px);margin:0;letter-spacing:.02em}
.place{font-size:clamp(11px,1.3vw,17px);color:#58738e;margin-top:4px}
.current{display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,32px);min-height:0}
#icon{font-size:clamp(45px,9vw,110px);line-height:1}
#temp{font-size:clamp(56px,12vw,140px);font-weight:750;letter-spacing:-.06em;line-height:1}
#condition{text-align:center;font-size:clamp(15px,2vw,25px);font-weight:650}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1.5vw,16px)}
.stat{background:#e1eff8;border-radius:14px;padding:clamp(10px,1.6vw,18px);min-width:0}
.label{font-size:clamp(11px,1.25vw,16px);color:#58738e;margin-bottom:5px}
.value{font-size:clamp(18px,2.5vw,30px);font-weight:700;white-space:nowrap}
footer{font-size:clamp(9px,1vw,12px);color:#58738e;display:flex;justify-content:space-between;gap:8px}
@media(max-aspect-ratio:1/1){.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main class="widget">
  <header class="top">
    <div class="mark"></div>
    <div><h1>VÄDRET I SÄVE</h1><div class="place">Göteborg · Prognos från SMHI</div></div>
  </header>
  <section>
    <div class="current"><div id="icon">🌤️</div><div id="temp">--°</div></div>
    <div id="condition">Hämtar väder…</div>
  </section>
  <section class="stats">
    <div class="stat"><div class="label">Vind</div><div class="value" id="wind">-- m/s</div></div>
    <div class="stat"><div class="label">Nederbörd</div><div class="value" id="rain">-- %</div></div>
  </section>
  <footer><span>Källa: SMHI</span><span id="updated">Ansluter…</span></footer>
</main>
<script>
const API="https://opendata-download-metfcst.smhi.se/api/category/snow1g/version/1/geotype/point/lon/11.92/lat/57.78/data.json";
const symbols={
1:["☀️","Klart"],2:["🌤️","Nästan klart"],3:["🌤️","Växlande molnighet"],4:["⛅","Halvklart"],
5:["🌥️","Molnigt"],6:["☁️","Mulet"],7:["🌫️","Dimma"],8:["🌦️","Lätta regnskurar"],
9:["🌧️","Regnskurar"],10:["🌧️","Kraftiga regnskurar"],11:["⛈️","Åskskurar"],12:["🌨️","Lätta snöbyar"],
13:["🌨️","Snöbyar"],14:["🌨️","Kraftiga snöbyar"],15:["🌧️","Lätt regn"],16:["🌧️","Regn"],
17:["🌧️","Kraftigt regn"],18:["🌨️","Lätt snöfall"],19:["🌨️","Snöfall"],20:["🌨️","Kraftigt snöfall"],
21:["🌧️","Lätt regn och snö"],22:["🌧️","Regn och snö"],23:["🌨️","Kraftigt regn och snö"],
24:["⛈️","Lätt åska"],25:["⛈️","Åska"],26:["⛈️","Kraftig åska"],27:["🌨️","Lätt snö och åska"],
28:["🌨️","Snö och åska"],29:["🌨️","Kraftig snö och åska"]
};
const put=(id,v)=>document.getElementById(id).textContent=v;
async function refresh(){
 try{
  const res=await fetch(API,{cache:"no-store"});
  if(!res.ok)throw Error("HTTP "+res.status);
  const json=await res.json(), rows=json.timeSeries||[];
  if(!rows.length)throw Error("No forecast");
  const now=Date.now(), row=rows.find(x=>Date.parse(x.time)>=now-30*60*1000)||rows[0], d=row.data;
  const s=symbols[d.symbol_code]||["🌡️","Väderprognos"];
  put("icon",s[0]);put("temp",Number.isFinite(d.air_temperature)?Math.round(d.air_temperature)+"°":"--°");
  put("condition",s[1]);put("wind",Number.isFinite(d.wind_speed)?d.wind_speed.toFixed(1)+" m/s":"-- m/s");
  put("rain",Number.isFinite(d.probability_of_precipitation)?Math.round(d.probability_of_precipitation)+" %":"-- %");
  const time=new Date(json.createdTime||json.referenceTime||Date.now());
  put("updated","Uppdaterad "+new Intl.DateTimeFormat("sv-SE",{hour:"2-digit",minute:"2-digit"}).format(time));
 }catch(e){put("condition","Väderdata kunde inte hämtas");put("updated","Kontrollera anslutningen");console.error(e);}
}
refresh();setInterval(refresh,15*60*1000);
</script>
</body>
</html>
